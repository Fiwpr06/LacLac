name: lac-lac-dev

services:
  mongodb:
    image: mongo:7
    container_name: laclac-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: lac_lac
    volumes:
      - mongodb_data:/data/db
    networks:
      - laclac-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-init:
    image: mongo:7
    container_name: laclac-mongo-init
    restart: no
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --host mongodb:27017 --eval
      'try { rs.status(); print("Replica set already initialized"); } catch(e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }); print("Replica set initialized"); }'
    networks:
      - laclac-net

  redis:
    image: redis:7-alpine
    container_name: laclac-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - laclac-net

networks:
  laclac-net:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
